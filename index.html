<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بلاغ قسم الخدمات العامة</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root{
    --navy:#071a33;
    --navy-light:#0d2b50;
    --gold:#c8a951;
    --gold-light:#eadb9b;
    --bg:#f4f6f9;
    --text:#17283d;
    --muted:#718096;
    --danger:#b42318;
    --success:#147a4b;
    --border:#d9e0e9;

    --radius:16px;
    --shadow:0 14px 40px rgba(8, 20, 40, .12);
}

*{box-sizing:border-box}
html,body{height:100%}

body{
    margin:0;
    color:var(--text);
    font-family:Tahoma,Arial,sans-serif;
    background-color: var(--navy);

    background:
    radial-gradient(circle at 10% 10%,rgba(47,101,165,.08),transparent 28%),
    radial-gradient(circle at 90% 80%,rgba(200,169,81,.09),transparent 28%),
    var(--bg);

    display:flex;
    flex-direction:column;
}

button,input,select,textarea{font-family:inherit}
button{
    border:0;
    cursor:pointer;
    transition:.25s ease;
}
button:hover{
    transform:translateY(-2px);
    filter:brightness(1.05)
}

@keyframes fadeUp {
  from{ opacity:0; transform:translateY(14px); }
  to{ opacity:1; transform:translateY(0); }
}

@keyframes floaty {
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-6px); }
}

@keyframes shimmer {
  0%{ transform:translateX(-120%) }
  100%{ transform:translateX(120%) }
}

.page{display:none}
.page.active{display:block; animation:fadeUp .35s ease both}

#pagesWrap{ flex:1; display:block; }

.site-footer{
    width:100%;
    text-align:center;
    padding:18px 12px;
    color:#6b7a90;
    margin-top:auto;
    font-size:14px;
    background: transparent !important;
}

.hero{
    position:relative;
    min-height:620px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    color:#fff;
    text-align:center;
    background:
    linear-gradient(135deg,rgba(4,18,37,.98),rgba(12,47,83,.95)),var(--navy)
}

.hero::before{
    content:"";
    position:absolute;
    inset:-40%;
    background:
      radial-gradient(circle at 20% 20%, rgba(200,169,81,.14), transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(47,101,165,.12), transparent 40%),
      radial-gradient(circle at 40% 80%, rgba(200,169,81,.09), transparent 35%);
    filter: blur(2px);
    animation: floaty 7s ease-in-out infinite;
    pointer-events:none;
}

.hero::after{
    content:"";
    position:absolute;
    left:-30%;
    top:-50%;
    width:120%;
    height:140%;
    background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,.08) 50%, transparent 60%);
    transform: rotate(10deg);
    animation: shimmer 4.5s ease-in-out infinite;
    pointer-events:none;
}

.hero-content{
    position:relative;
    z-index:1;
    width:min(850px,92%);
    padding:42px 25px
}

.logo-frame{
    width:190px;
    height:190px;
    margin:0 auto 28px;
    padding:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(232,210,139,.9);
    box-shadow:0 0 0 9px rgba(200,169,81,.08),0 18px 45px rgba(0,0,0,.28);
    animation: fadeUp .5s ease both, floaty 4.8s ease-in-out infinite;
}

.logo-frame img{
    width:100%;
    height:100%;
    object-fit:contain;
    border-radius:50%
}

.hero-line{
    width:92px;
    height:4px;
    margin:0 auto 20px;
    border-radius:6px;
    background:linear-gradient(90deg,transparent,var(--gold-light),transparent);
    position:relative;
    overflow:hidden;
}
.hero-line::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
    transform:translateX(-120%);
    animation: shimmer 2.6s ease-in-out infinite;
}

.hero h1{
    margin:0;
    color:#fff;
    font-size:clamp(28px,5vw,46px);
    letter-spacing:.2px;
    text-shadow:0 10px 30px rgba(0,0,0,.18);
}

.hero p{
    margin:15px auto 0;
    color:#c9d5e3;
    font-size:clamp(14px,2vw,18px)
}

.hero-buttons{
    display:flex;
    justify-content:center;
    gap:13px;
    flex-wrap:wrap;
    margin-top:34px
}

.btn-primary,
.btn-secondary,
.btn-danger,
.btn-success{
    padding:13px 24px;
    border-radius:12px;
    font-size:14px;
    font-weight:bold;
    position:relative;
    overflow:hidden;
}

.btn-primary{
    color:#17202b;
    background:linear-gradient(135deg,var(--gold-light),var(--gold));
    box-shadow:0 10px 24px rgba(200,169,81,.25);
}
.btn-primary::after{
    content:"";
    position:absolute;
    inset:-40%;
    background:linear-gradient(120deg, transparent 40%, rgba(255,255,255,.35) 50%, transparent 60%);
    transform:translateX(-120%);
    animation: shimmer 3.2s ease-in-out infinite;
}

.topbar{
    min-height:86px;
    padding:16px 5%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    color:#fff;
    background:linear-gradient(135deg,var(--navy),var(--navy-light));
    border-bottom:3px solid var(--gold);
    backdrop-filter: blur(10px);
}

.topbar-brand{
    display:flex;
    align-items:center;
    gap:12px
}

.topbar-logo{
    width:52px;
    height:52px;
    padding:3px;
    object-fit:contain;
    border-radius:50%;
    background:#fff;
    box-shadow:0 10px 25px rgba(0,0,0,.18);
}

.topbar h2{margin:0;font-size:19px}
.topbar small{color:#bfccda}

.content{
    width:min(1400px,94%);
    margin:30px auto
}

.card{
    padding:30px;
    background:rgba(255,255,255,.95);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    border:1px solid rgba(221, 231, 245, .8);
}

.form-card{border-top:4px solid var(--gold); max-width:900px; margin:auto}

.section-title{
    margin:0 0 12px;
    padding-right:13px;
    color:var(--navy);
    border-right:4px solid var(--gold)
}

.description{
    margin:0 0 25px;
    color:var(--muted)
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px
}

.field{
    display:flex;
    flex-direction:column;
    gap:7px
}

.field.full{grid-column:1/-1}

label{color:#263b53;font-weight:bold}
label span{color:var(--danger)}

input,select,textarea{
    width:100%;
    padding:13px;
    color:var(--text);
    font-size:14px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:12px;
    outline:none;
    transition:.2s ease;
}

input:focus,select:focus,textarea:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 4px rgba(200,169,81,.18)
}

textarea{min-height:135px;resize:vertical}
.submit-row{
    margin-top:22px;
    display:flex;
    justify-content:flex-start;
}

/* Alert */
.alert{
    display:none;
    padding:13px;
    margin-bottom:18px;
    border-radius:12px;
    font-weight:bold;
    border:1px solid transparent;
}

.alert.success{
    display:block;
    color:var(--success);
    background:#e9f7ef;
    border-color:#a4d9bb
}

.alert.error{
    display:block;
    color:var(--danger);
    background:#fff0ef;
    border-color:#e5aaa5
}

/* other fields toggle */
.other-field{display:none}
.other-field.show{display:flex}

/* ✅ تغطية الفراغ الأبيض تحت في الآيفون */
#homePage{ min-height: 100vh; }
#homePage .hero{ min-height: 100vh; padding-bottom: 40px; }

@media(max-width:800px){
    .hero{min-height:570px}
    #homePage .hero{min-height:100vh}

    .logo-frame{width:155px;height:155px}

    .hero-buttons{flex-direction:column;width:min(300px,100%);margin-right:auto;margin-left:auto}
    .hero-buttons button{width:100%}

    .topbar{align-items:flex-start;flex-direction:column}
    .topbar-actions{width:100%}
    .content{width:94%;margin:20px auto}
    .card{padding:19px}
    .form-grid{grid-template-columns:1fr}
    .field.full{grid-column:auto}
}
</style>
</head>

<body>
<div id="pagesWrap">

  <!-- الصفحة الرئيسية (زر واحد فقط: تقديم البلاغ) -->
  <section id="homePage" class="page active">
    <div class="hero">
      <div class="hero-content">

        <div class="logo-frame">
          <img src="logo.png" alt="شعار شرطة الكويت">
        </div>

        <div class="hero-line"></div>

        <h1>بلاغ قسم الخدمات العامة</h1>

        <div class="hero-buttons">
          <button class="btn-primary" onclick="showReportPage()">تقديم البلاغ</button>
        </div>
      </div>
    </div>
  </section>

  <!-- صفحة نموذج البلاغ -->
  <section id="reportPage" class="page">
    <div class="topbar">
      <div class="topbar-brand">
        <img class="topbar-logo" src="logo.png" alt="الشعار">
        <div>
          <h2>بلاغ قسم الخدمات العامة</h2>
          <small>تقديم بلاغ جديد</small>
        </div>
      </div>

      <button class="btn-secondary" style="background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:12px;padding:10px 16px;"
              onclick="showHomePage()">
        الرئيسية
      </button>
    </div>

    <main class="content">
      <div class="card form-card">
        <h2 class="section-title">نموذج البلاغ</h2>

        <p class="description">يرجى تعبئة البيانات المطلوبة لإرسال البلاغ.</p>

        <div id="formAlert" class="alert"></div>

        <form id="reportForm">
          <div class="form-grid">
            <div class="field">
              <label for="location">الإدارة أو موقع البلاغ <span>*</span></label>
              <select id="location" required onchange="handleOtherLocation()">
                <option value="">اختر الإدارة أو الموقع</option>
              </select>
            </div>

            <div class="field">
              <label for="reportType">نوع البلاغ <span>*</span></label>
              <select id="reportType" required onchange="handleOtherType()">
                <option value="">اختر نوع البلاغ</option>
              </select>
            </div>

            <div class="field other-field" id="otherLocationField">
              <label for="otherLocation">اكتب الإدارة أو الموقع <span>*</span></label>
              <input id="otherLocation" type="text">
            </div>

            <div class="field other-field" id="otherTypeField">
              <label for="otherType">اكتب نوع البلاغ <span>*</span></label>
              <input id="otherType" type="text">
            </div>

            <div class="field full">
              <label for="description">وصف المشكلة <span>*</span></label>
              <textarea id="description" required placeholder="اكتب وصفاً واضحاً للمشكلة..."></textarea>
            </div>

            <div class="field">
              <label for="reporterName">اسم المبلغ <span>*</span></label>
              <input id="reporterName" type="text" required placeholder="الاسم الكامل">
            </div>

            <div class="field">
              <label for="reporterPhone">رقم المبلغ <span>*</span></label>
              <input id="reporterPhone" type="tel" required placeholder="رقم الهاتف">
            </div>
          </div>

          <div class="submit-row">
            <button class="btn-primary" type="submit">إرسال البلاغ</button>
          </div>
        </form>
      </div>
    </main>
  </section>

</div>

<footer class="site-footer">
  جميع الحقوق محفوظة © قسم الخدمات العامة
</footer>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  const SUPABASE_URL = "https://sipumbqxcewdyttnurii.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_wr_BnVo-z-zF45zwLFXGtQ_usB7XEjf";

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const DEPARTMENTS_KEY="public_services_departments";
  const TYPES_KEY="public_services_types";

  let departments=JSON.parse(localStorage.getItem(DEPARTMENTS_KEY))||[
      "إدارة الخدمات المالية و الادارية و الصيانة",
      "إدارة الجنسية",
      "إدارة البحث و المتابعة",
      "إدارة المكتب الفني",
      "إدارة وثائق السفر",
      "مكتب مساعد المدير العام",
      "مكتب المدير العام",
      "إدارة الهوية الوطنية"
  ];

  let reportTypes=JSON.parse(localStorage.getItem(TYPES_KEY))||[
      "كهربائي",
      "مستلزمات مكتبية",
      "صحي",
      "طابعة",
      "كمبيوتر",
      "نظافة",
      "مرافق المبنى"
  ];

  function showAlert(id,message,type){
      const box=document.getElementById(id);
      box.textContent=message;
      box.className="alert "+type;
      setTimeout(()=>{
          box.textContent="";
          box.className="alert";
      },5000);
  }

  function showHomePage(){
      document.getElementById("homePage").classList.add("active");
      document.getElementById("reportPage").classList.remove("active");
  }

  function showReportPage(){
      document.getElementById("homePage").classList.remove("active");
      document.getElementById("reportPage").classList.add("active");
  }

  window.showHomePage = showHomePage;
  window.showReportPage = showReportPage;

  function handleOtherLocation(){
      const selected=document.getElementById("location").value;
      const field=document.getElementById("otherLocationField");
      const input=document.getElementById("otherLocation");

      field.classList.toggle("show",selected==="أخرى");
      input.required=selected==="أخرى";
      if(selected!=="أخرى") input.value="";
  }

  function handleOtherType(){
      const selected=document.getElementById("reportType").value;
      const field=document.getElementById("otherTypeField");
      const input=document.getElementById("otherType");

      field.classList.toggle("show",selected==="أخرى");
      input.required=selected==="أخرى";
      if(selected!=="أخرى") input.value="";
  }

  window.handleOtherLocation = handleOtherLocation;
  window.handleOtherType = handleOtherType;

  function loadFormOptions(){
      const location=document.getElementById("location");
      const type=document.getElementById("reportType");

      location.innerHTML='<option value="">اختر الإدارة أو الموقع</option>';
      departments.forEach(item=>{
          const option=document.createElement("option");
          option.value=item;
          option.textContent=item;
          location.appendChild(option);
      });
      location.innerHTML+='<option value="أخرى">أخرى</option>';

      type.innerHTML='<option value="">اختر نوع البلاغ</option>';
      reportTypes.forEach(item=>{
          const option=document.createElement("option");
          option.value=item;
          option.textContent=item;
          type.appendChild(option);
      });
      type.innerHTML+='<option value="أخرى">أخرى</option>';
  }

  document.getElementById("reportForm").addEventListener("submit", async function(event){
    event.preventDefault();

    let location=document.getElementById("location").value.trim();
    let type=document.getElementById("reportType").value.trim();

    if(location==="أخرى") location=document.getElementById("otherLocation").value.trim();
    if(type==="أخرى") type=document.getElementById("otherType").value.trim();

    const reporterName=document.getElementById("reporterName").value.trim();
    const reporterPhone=document.getElementById("reporterPhone").value.trim();
    const description=document.getElementById("description").value.trim();

    if(!location || !type || !description || !reporterName || !reporterPhone){
        showAlert("formAlert","يرجى تعبئة جميع الخانات المطلوبة.","error");
        return;
    }

    try{
       const payload = {
          title: location,
          reporter_id: type,
          description: description,
          status: "قيد التنفيذ",
          technician: "",
          notes: "",
          reporter_name: reporterName,
          reporter_phone: reporterPhone
       };

       const { data, error } = await supabase
          .from("reports")
          .insert(payload)
          .select("report_number")
          .single();

       if(error) throw error;

       const bgNumber = data?.report_number ?? "";

       this.reset();
       document.getElementById("otherLocationField").classList.remove("show");
       document.getElementById("otherTypeField").classList.remove("show");

       if(bgNumber){
          showAlert("formAlert",`تم إرسال البلاغ بنجاح. رقم البلاغ: ${bgNumber}`,"success");
       }else{
          showAlert("formAlert","تم إرسال البلاغ بنجاح.","success");
       }

    }catch(err){
        console.error(err);
        showAlert("formAlert","فشل إرسال البلاغ. تأكد من إعدادات RLS و أعمدة الجدول.","error");
    }
  });

  // init
  loadFormOptions();
</script>

</body>
</html>
